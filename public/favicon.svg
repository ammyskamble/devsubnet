<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="devsubnet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="50%" stop-color="#a142f4"/>
      <stop offset="100%" stop-color="#24c6dc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Node -->
  <rect width="512" height="512" rx="128" fill="url(#devsubnet-grad)"/>

  <!-- Network Subnet Node Connections Graphic -->
  <g fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Root CIDR Network Node -->
    <circle cx="256" cy="140" r="32" fill="#ffffff" />
    
    <!-- Subnet Partition Branch Lines -->
    <path d="M256 172 v72" />
    <path d="M150 288 h212" />
    <path d="M150 244 v44" />
    <path d="M362 244 v44" />
    <path d="M150 288 v64" />
    <path d="M362 288 v64" />

    <!-- Subnet Leaf Nodes -->
    <circle cx="150" cy="372" r="24" fill="#ffffff" />
    <circle cx="362" cy="372" r="24" fill="#ffffff" />

    <!-- CIDR Slash Slash Indicator -->
    <path d="M280 200 l-48 80" stroke="#ffffff" stroke-width="28" />
  </g>
</svg>
